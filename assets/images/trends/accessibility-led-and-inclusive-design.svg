4" cy="113" r="6" fill="#FF6B5E" stroke="none" stroke-width="0" opacity="1" /><circle cx="116" cy="113" r="6" fill="#F3C84B" stroke="none" stroke-width="0" opacity="1" /><circle cx="138" cy="113" r="6" fill="#45BE6F" stroke="none" stroke-width="0" opacity="1" /><rect x="180" y="104" width="900" height="18" rx="9" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="0.65" /><rect x="88" y="150" width="1024" height="514" rx="0" fill="#F4F1E8" stroke="none" stroke-width="0" opacity="1.0" /><text x="123" y="202" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#111" text-anchor="start" opacity="1.0" letter-spacing="0">CLEAR BY DESIGN.</text><text x="123" y="238" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#111" text-anchor="start" opacity="1.0" letter-spacing="0">Strong contrast · visible focus · explicit labels</text><rect x="123" y="275" width="570" height="300" rx="8" fill="#FFF" stroke="#111" stroke-width="2" opacity="1.0" /><text x="153" y="320" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111" text-anchor="start" opacity="1.0" letter-spacing="0">Email address</text><rect x="153" y="338" width="500" height="52" rx="4" fill="#FFF" stroke="#3D4CFF" stroke-width="4" opacity="1.0" /><text x="170" y="370" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#4D4D4D" text-anchor="start" opacity="1.0" letter-spacing="0">name@example.com</text><text x="153" y="430" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111" text-anchor="start" opacity="1.0" letter-spacing="0">Message</text><rect x="153" y="448" width="500" height="80" rx="4" fill="#FFF" stroke="#111" stroke-width="2" opacity="1.0" /><rect x="153" y="545" width="190" height="50" rx="3" fill="#111" stroke="none" stroke-width="0" opacity="1.0" /><text x="248" y="577" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFF" text-anchor="middle" opacity="1.0" letter-spacing="0">SEND MESSAGE</text><rect x="738" y="275" width="310" height="300" rx="8" fill="#111" stroke="none" stroke-width="0" opacity="1.0" /><circle cx="773" cy="320" r="15" fill="#C8FF53" stroke="none" stroke-width="0" opacity="1" /><text x="773" y="326" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#111" text-anchor="middle" opacity="1.0" letter-spacing="0">✓</text><text x="808" y="327" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FFF" text-anchor="start" opacity="1.0" letter-spacing="0">44px targets</text><circle cx="773" cy="370" r="15" fill="#C8FF53" stroke="none" stroke-width="0" opacity="1" /><text x="773" y="376" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#111" text-anchor="middle" opacity="1.0" letter-spacing="0">✓</text><text x="808" y="377" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FFF" text-anchor="start" opacity="1.0" letter-spacing="0">Keyboard focus</text><circle cx="773" cy="420" r="15" fill="#C8FF53" stroke="none" stroke-width="0" opacity="1" /><text x="773" y="426" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#111" text-anchor="middle" opacity="1.0" letter-spacing="0">✓</text><text x="808" y="427" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FFF" text-anchor="start" opacity="1.0" letter-spacing="0">Link underlines</text><circle cx="773" cy="470" r="15" fill="#C8FF53" stroke="none" stroke-width="0" opacity="1" /><text x="773" y="476" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#111" text-anchor="middle" opacity="1.0" letter-spacing="0">✓</text><text x="808" y="477" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FFF" text-anchor="start" opacity="1.0" letter-spacing="0">Reduced motion</text><circle cx="773" cy="520" r="15" fill="#C8FF53" stroke="none" stroke-width="0" opacity="1" /><text x="773" y="526" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#111" text-anchor="middle" opacity="1.0" letter-spacing="0">✓</text><text x="808" y="527" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FFF" text-anchor="start" opacity="1.0" letter-spacing="0">Error text + icon</text><text x="55" y="723" font-family="Arial, sans-serif" font-size="23" font-weight="750" fill="#111111" text-anchor="start" opacity="1.0" letter-spacing="0">Accessibility-Led and Inclusive Design</text><text x="1145" y="723" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#111111" text-anchor="end" opacity="0.72" letter-spacing="1.2">REPRESENTATIVE RECONSTRUCTION</text></svg>