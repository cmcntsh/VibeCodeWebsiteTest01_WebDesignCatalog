<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">Accessibility-Led and Inclusive Design representative reconstruction</title><desc id="desc">Representative reconstruction of Accessibility-Led and Inclusive Design, showing strong text and control contrast, clearly visible keyboard focus, underlined or otherwise recognizable links.</desc>
    <defs>
      <linearGradient id="gradA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3D4CFF"/><stop offset="1" stop-color="#C8FF53"/></linearGradient>
      <linearGradient id="gradB" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C8FF53"/><stop offset="1" stop-color="#FF6B5E"/></linearGradient>
      <radialGradient id="radial"><stop offset="0" stop-color="#C8FF53"/><stop offset="1" stop-color="#3D4CFF" stop-opacity="0"/></radialGradient>
      <filter id="shadowSoft"><feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#000000" flood-opacity="0.20"/></filter>
      <filter id="shadowHard"><feDropShadow dx="9" dy="9" stdDeviation="0" flood-color="#000000" flood-opacity="0.55"/></filter>
      <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
      <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="60"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .18"/></feComponentTransfer></filter>
      <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#3D4CFF" stroke-opacity=".22" stroke-width="1"/></pattern>
      <pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#3D4CFF"/><rect x="10" y="10" width="10" height="10" fill="#3D4CFF"/><rect x="10" width="10" height="10" fill="#C8FF53"/><rect y="10" width="10" height="10" fill="#C8FF53"/></pattern>
      <clipPath id="screenClip"><rect x="70" y="110" width="1060" height="570" rx="18"/></clipPath>
    </defs>
    <rect x="0" y="0" width="1200" height="750" rx="0" fill="#F4F1E8" stroke="none" stroke-width="0" opacity="1.0" /><line x1="0" y1="0" x2="0" y2="750" stroke="#111111" stroke-width="1" opacity="0.035"/><line x1="60" y1="0" x2="60" y2="750" stroke="#111111" stroke-width="1" opacity="0.035"/><line x1="120" y1="0" x2="120" y2="750" stroke="#111111" stroke-width="1" opacity="0.035"/><line x1="180" y1="0" x2="180" y2="750" stroke="#111111" stroke-width="1" opacity="0.035"/><line x1="240" y1="0" x2="240" y2="750" stroke="#111111" stroke-width="1" opacity="0.035"/><line x1="300" y1="0" x2="300" y2="750" stroke="#111111" stroke-width="1" opacity="0.035"/><line x1="360" y1="0" x2="360" y2="750" stroke="#111111" stroke-width="1" opacity="0.035"/><line x1="420" y1="0" x2="420" y2="750" stroke="#111111" stroke-width="1" opacity="0.035"/><line x1="480" y1="0" x2="480" y2="750" stroke="#111111" stroke-width="1" opacity="0.035"/><line x1="540" y1="0" x2="540" y2="750" stroke="#111111" stroke-width="1" opacity="0.035"/><line x1="600" y1="0" x2="600" y2="750" stroke="#111111" stroke-width="1" opacity="0.035"/><line x1="660" y1="0" x2="660" y2="750" stroke="#111111" stroke-width="1" opacity="0.035"/><line x1="720" y1="0" x2="720" y2="750" stroke="#111111" stroke-width="1" opacity="0.035"/><line x1="780" y1="0" x2="780" y2="750" stroke="#111111" stroke-width="1" opacity="0.035"/><line x1="840" y1="0" x2="840" y2="750" stroke="#111111" stroke-width="1" opacity="0.035"/><line x1="900" y1="0" x2="900" y2="750" stroke="#111111" stroke-width="1" opacity="0.035"/><line x1="960" y1="0" x2="960" y2="750" stroke="#111111" stroke-width="1" opacity="0.035"/><line x1="1020" y1="0" x2="1020" y2="750" stroke="#111111" stroke-width="1" opacity="0.035"/><line x1="1080" y1="0" x2="1080" y2="750" stroke="#111111" stroke-width="1" opacity="0.035"/><line x1="1140" y1="0" x2="1140" y2="750" stroke="#111111" stroke-width="1" opacity="0.035"/><line x1="1200" y1="0" x2="1200" y2="750" stroke="#111111" stro