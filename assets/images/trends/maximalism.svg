<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">Maximalism representative reconstruction</title><desc id="desc">Representative reconstruction of Maximalism, showing dense composition, numerous colors and typefaces, pattern mixing.</desc>
