<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">Grunge Web Design representative reconstruction</title><desc id="desc">Representative reconstruction of Grunge Web Design, showing torn paper and tape, scratches, stains, photocopy noise, and ink splatters, uneven baselines.</desc>
