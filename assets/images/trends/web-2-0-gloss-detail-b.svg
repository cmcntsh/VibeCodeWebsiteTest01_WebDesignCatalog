      <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FF7A00" stroke-opacity=".22" stroke-width="1"/></pattern>
      <pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FF7A00"/><rect x="10" y="10" width="10" height="10" fill="#FF7A00"/><rect x="10" width="10" height="10" fill="#A6E43F"/><rect y="10" width="10" height="10" fill="#A6E43F"/></pattern>
      <clipPath id="screenClip"><rect x="70" y="110" width="1060" height="570" rx="18"/></clipPath>
    </defs>
