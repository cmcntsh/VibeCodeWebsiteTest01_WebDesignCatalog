<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">Bold Typography and Type-First Design representative reconstruction</title><desc id="desc">Representative reconstruction of Bold Typography and Type-First Design, showing extra-large headlines, variable or custom webfonts, dramatic scale contrast.</desc>
    <defs>
      <linearGradient id="gradA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B13B30"/><stop offset="1" stop-color="#D1A94C"/></linearGradient>
