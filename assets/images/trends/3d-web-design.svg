<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">3D Web Design representative reconstruction</title><desc id="desc">Representative reconstruction of 3D Web Design, showing rotatable product models, 3d typography, particle systems.</desc>
    <defs>
      <linearGradient id="gradA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#645CFF"/><stop offset="1" stop-color="#FF3D8D"/></linearGradient>
