<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">Browser-Default Brutalism representative reconstruction</title><desc id="desc">Representative reconstruction of Browser-Default Brutalism, showing default browser fonts and link colors, minimal or absent css, exposed lists, tables, buttons, and form controls.</desc>
    <defs>
      <linearGradient id="gradA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF4F34"/><stop offset="1" stop-color="#37D67A"/></linearGradient>
      <linearGradient id="gradB" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#37D67A"/><stop offset="1" stop-color="#7347FF"/></linearGradient>
      <radialGradient id="radial"><stop offset="0" stop-color="#37D67A"/><stop offset="1" stop-color="#FF4F34" stop-opacity="0"/></radialGradient>
      <filter id="shadowSoft"><feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#000000" flood-opacity="0.20"/></filter>
      <filter id="shadowHard"><feDropShadow dx="9" dy="9" stdDeviation="0" flood-color="#000000" flood-opacity="0.55"/></filter>
      <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
      <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="4"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .18"/></feComponentTransfer></filter>
      <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FF4F34" stroke-opacity=".22" stroke-width="1"/></pattern>
      <pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FF4F34"/><rect x="10" y="10" width="10" height="10" fill="#FF4F34"/><rect x="10" width="10" height="10" fill="#37D67A"/><rect y="10" width="10" height="10" fill="#37D67A"/></pattern>
      <clipPath id="screenClip"><rect x="70" y="110" width="1060" height="570" rx="18"/></clipPath>
    </defs>
