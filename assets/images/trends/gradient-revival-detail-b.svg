<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">Gradient Revival representative reconstruction</title><desc id="desc">Representative reconstruction of Gradient Revival, showing multi-hue backgrounds, vibrant blue-purple-pink transitions, mesh gradients.</desc>
    <defs>
      <linearGradient id="gradA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9A62FF"/><stop offset="1" stop-color="#FF6CAA"/></linearGradient>
      <linearGradient id="gradB" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6CAA"/><stop offset="1" stop-color="#0D2030"/></linearGradient>
      <radialGradient id="radial"><stop offset="0" stop-color="#FF6CAA"/><stop offset="1" stop-color="#9A62FF" stop-opacity="0"/></radialGradient>
      <filter id="shadowSoft"><feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#000000" flood-opacity="0.20"/></filter>
