<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">Frame-Based Design representative reconstruction</title><desc id="desc">Representative reconstruction of Frame-Based Design, showing navigation permanently fixed in a left or top frame, main content loading into a separate pane, visible frame borders or scrollbars.</desc>
