<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">Text-Only or Document-Style Web representative reconstruction</title><desc id="desc">Representative reconstruction of Text-Only or Document-Style Web, showing plain text on a white or gray browser background, blue underlined hyperlinks and purple visited links, one continuous vertical column.</desc>
    <defs>
      <linearGradient id="gradA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6B178B"/><stop offset="1" stop-color="#FF3DC8"/></linearGradient>
      <linearGradient id="gradB" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF3DC8"/><stop offset="1" stop-color="#171717"/></linearGradient>
      <radialGradient id="radial"><stop offset="0" stop-color="#FF3DC8"/><stop offset="1" stop-color="#6B178B" stop-opacity="0"/></radialGradient>
      <filter id="shadowSoft"><feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#000000" flood-opacity="0.20"/></filter>
      <filter id="shadowHard"><feDropShadow dx="9" dy="9" stdDeviation="0" flood-color="#000000" flood-opacity="0.55"/></filter>
      <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
      <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="1"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .18"/></feComponentTransfer></filter>
      <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#6B178B" stroke-opacity=".22" stroke-width="1"/></pattern>
      <pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#6B178B"/><rect x="10" y="10" width="10" height="10" fill="#6B178B"/><rect x="10" width="10" height="10" fill="#FF3DC8"/><rect y="10" width="10" height="10" fill="#FF3DC8"/></pattern>
      <clipPath id="screenClip"><rect x="70" y="110" width="1060" height="570" rx="18"/></clipPath>
    </defs>
    <rect x="0" y="0" width="1200" height="750" rx="0" fill="#D8D4FF" stroke="none" stroke-width="0" opacity="1.0" /><line x1="0" y1="0" x2="0" y2="750" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="60" y1="0" x2="60" y2="750" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="120" y1="0" x2="120" y2="750" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="180" y1="0" x2="180" y2="750" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="240" y1="0" x2="240" y2="750" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="300" y1="0" x2="300" y2="750" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="360" y1="0" x2="360" y2="750" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="420" y1="0" x2="420" y2="750" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="480" y1="0" x2="480" y2="750" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="540" y1="0" x2="540" y2="750" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="600" y1="0" x2="600" y2="750" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="660" y1="0" x2="660" y2="750" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="720" y1="0" x2="720" y2="750" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="780" y1="0" x2="780" y2="750" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="840" y1="0" x2="840" y2="750" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="900" y1="0" x2="900" y2="750" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="960" y1="0" x2="960" y2="750" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="1020" y1="0" x2="1020" y2="750" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="1080" y1="0" x2="1080" y2="750" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="1140" y1="0" x2="1140" y2="750" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="1200" y1="0" x2="1200" y2="750" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="0" y1="0" x2="1200" y2="0" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="0" y1="60" x2="1200" y2="60" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="0" y1="120" x2="1200" y2="120" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="0" y1="180" x2="1200" y2="180" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="0" y1="240" x2="1200" y2="240" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="0" y1="300" x2="1200" y2="300" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="0" y1="360" x2="1200" y2="360" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="0" y1="420" x2="1200" y2="420" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="0" y1="480" x2="1200" y2="480" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="0" y1="540" x2="1200" y2="540" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="0" y1="600" x2="1200" y2="600" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="0" y1="660" x2="1200" y2="660" stroke="#0000EE" stroke-width="1" opacity="0.035"/><line x1="0" y1="720" x2="1200" y2="720" stroke="#0000EE" stroke-width="1" opacity="0.035"/><text x="55" y="58" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#0000EE" text-anchor="start" opacity="1.0" letter-spacing="1.5">WDTC–0001</text><text x="1145" y="58" font-family="Courier New, monospace" font-size="16" font-weight="600" fill="#0000EE" text-anchor="end" opacity="1.0" letter-spacing="0">1991–1995</text><rect x="70" y="92" width="1060" height="590" rx="0" fill="#C8C8C8" stroke="#0000EE" stroke-width="3" opacity="1.0" filter="url(#shadowHard)"/><rect x="74" y="96" width="1052" height="34" rx="0" fill="#111D87" stroke="#FFFFFF" stroke-width="1" opacity="1.0" /><text x="86" y="120" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start" opacity="1.0" letter-spacing="0">NCSA Mosaic — [Web Design Trend Catalog]</text><text x="85" y="152" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#111" text-anchor="start" opacity="1.0" letter-spacing="0">File</text><text x="157" y="152" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#111" text-anchor="start" opacity="1.0" letter-spacing="0">Edit</text><text x="229" y="152" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#111" text-anchor="start" opacity="1.0" letter-spacing="0">View</text><text x="301" y="152" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#111" text-anchor="start" opacity="1.0" letter-spacing="0">Navigate</text><rect x="75" y="162" width="1050" height="515" rx="0" fill="#FFFFFF" stroke="#777" stroke-width="1" opacity="1.0" /><text x="96" y="209" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#111" text-anchor="start" opacity="1.0" letter-spacing="0">The World Wide Web project</text><text x="96" y="249" font-family="Georgia, serif" font-size="17" font-weight="400" fill="#111" text-anchor="start" opacity="1.0" letter-spacing="0">The World Wide Web (W3) is a wide-area hypermedia information retrieval initiative</text><text x="96" y="274" font-family="Georgia, serif" font-size="17" font-weight="400" fill="#111" text-anchor="start" opacity="1.0" letter-spacing="0">aimed at giving universal access to a large universe of documents.</text><line x1="96" y1="299" x2="845.76" y2="299" stroke="#777" stroke-width="1" opacity="1"/><text x="96" y="334" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#111" text-anchor="start" opacity="1.0" letter-spacing="0">What’s out there?</text><text x="96" y="361" font-family="Georgia, serif" font-size="16" font-weight="400" fill="#111" text-anchor="start" opacity="1.0" letter-spacing="0">Pointers to the world’s online information, subjects, servers, etc.</text><text x="448" y="361" font-family="Georgia, serif" font-size="16" font-weight="400" fill="#0000EE" text-anchor="start" opacity="1.0" letter-spacing="0">linked document</text><text x="96" y="399" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#111" text-anchor="start" opacity="1.0" letter-spacing="0">Help</text><text x="96" y="426" font-family="Georgia, serif" font-size="16" font-weight="400" fill="#111" text-anchor="start" opacity="1.0" letter-spacing="0">On the browser you are using</text><text x="448" y="426" font-family="Georgia, serif" font-size="16" font-weight="400" fill="#0000EE" text-anchor="start" opacity="1.0" letter-spacing="0">linked document</text><text x="96" y="464" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#111" text-anchor="start" opacity="1.0" letter-spacing="0">Software Products</text><text x="96" y="491" font-family="Georgia, serif" font-size="16" font-weight="400" fill="#111" text-anchor="start" opacity="1.0" letter-spacing="0">A list of project components and their current state.</text><text x="448" y="491" font-family="Georgia, serif" font-size="16" font-weight="400" fill="#0000EE" text-anchor="start" opacity="1.0" letter-spacing="0">linked document</text><text x="96" y="529" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#111" text-anchor="start" opacity="1.0" letter-spacing="0">History</text><text x="96" y="556" font-family="Georgia, serif" font-size="16" font-weight="400" fill="#111" text-anchor="start" opacity="1.0" letter-spacing="0">A summary of the history of the project.</text><text x="448" y="556" font-family="Georgia, serif" font-size="16" font-weight="400" fill="#0000EE" text-anchor="start" opacity="1.0" letter-spacing="0">linked document</text><rect x="88" y="622" width="310" height="38" rx="2" fill="#D8D4FF" stroke="#0000EE" stroke-width="2" opacity="0.96" /><text x="105" y="647" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#0000EE" text-anchor="start" opacity="1.0" letter-spacing="1.2">DETAIL A / STRUCTURE</text><circle cx="990" cy="227" r="56" fill="none" stroke="#FF3DC8" stroke-width="4" opacity="0.85" /><line x1="1032" y1="269" x2="1080" y2="317" stroke="#FF3DC8" stroke-width="4" opacity="1"/><text x="55" y="723" font-family="Arial, sans-serif" font-size="23" font-weight="750" fill="#0000EE" text-anchor="start" opacity="1.0" letter-spacing="0">Text-Only or Document-Style Web</text><text x="1145" y="723" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#0000EE" text-anchor="end" opacity="0.72" letter-spacing="1.2">REPRESENTATIVE RECONSTRUCTION</text></svg>