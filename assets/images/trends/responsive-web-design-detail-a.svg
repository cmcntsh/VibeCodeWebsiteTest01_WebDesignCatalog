<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">Responsive Web Design representative reconstruction</title><desc id="desc">Representative reconstruction of Responsive Web Design, showing layouts that reflow at defined breakpoints, flexible images and media, columns stacking on small screens.</desc>
    <defs>
      <linearGradient id="gradA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7D8A18"/><stop offset="1" stop-color="#D3E855"/></linearGradient>
      <linearGradient id="gradB" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D3E855"/><stop offset="1" stop-color="#4753FF"/></linearGradient>
      <radialGradient id="radial"><stop offset="0" stop-color="#D3E855"/><stop offset="1" stop-color="#7D8A18" stop-opacity="0"/></radialGradient>
      <filter id="shadowSoft"><feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#000000" flood-opacity="0.20"/></filter>
      <filter id="shadowHard"><feDropShadow dx="9" dy="9" stdDeviation="0" flood-color="#000000" flood-opacity="0.55"/></filter>
      <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
      <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="25"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .18"/></feComponentTransfer></filter>
      <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#7D8A18" stroke-opacity=".22" stroke-width="1"/></pattern>
      <pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#7D8A18"/><rect x="10" y="10" width="10" height="10" fill="#7D8A18"/><rect x="10" width="10" height="10" fill="#D3E855"/><rect y="10" width="10" height="10" fill="#D3E855"/></pattern>
      <clipPath id="screenClip"><rect x="70" y="110" width="1060" height="570" rx="18"/></clipPath>
    </defs>
