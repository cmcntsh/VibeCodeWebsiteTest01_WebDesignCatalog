ty="1.0" /><rect x="998.0" y="440" width="75.0" height="115" rx="5" fill="#D3E855" stroke="none" stroke-width="0" opacity="1.0" /><text x="448" y="622" font-family="Courier New, monospace" font-size="15" font-weight="700" fill="#202416" text-anchor="middle" opacity="1.0" letter-spacing="0">flexible grid → flexible media → media queries</text><rect x="88" y="622" width="310" height="38" rx="2" fill="#F1F2E8" stroke="#202416" stroke-width="2" opacity="0.96" /><text x="105" y="647" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#202416" text-anchor="start" opacity="1.0" letter-spacing="1.2">DETAIL A / STRUCTURE</text><circle cx="990" cy="227" r="56" fill="none" stroke="#D3E855" stroke-width="4" opacity="0.85" /><line x1="1032" y1="269" x2="1080" y2="317" stroke="#D3E855" stroke-width="4" opacity="1"/><text x="55" y="723" font-family="Arial, sans-serif" font-size="23" font-weight="750" fill="#202416" text-anchor="start" opacity="1.0" letter-spacing="0">Responsive Web Design</text><text x="1145" y="723" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#202416" text-anchor="end" opacity="0.72" letter-spacing="1.2">REPRESENTATIVE RECONSTRUCTION</text></svg>