<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">Table-Based Layout representative reconstruction</title><desc id="desc">Representative reconstruction of Table-Based Layout, showing nested tables creating headers, sidebars, and columns, fixed widths, commonly optimized for 640×480 or 800×600 screens, transparent spacer gifs controlling gaps.</desc>
